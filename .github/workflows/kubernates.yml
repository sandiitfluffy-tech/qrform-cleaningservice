name: Deploy Production FBSV2 to Kubernetes
on:
  push:
    branches: ["main"]
jobs:
  deploy:
    runs-on: [self-hosted, k3smaster]
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout Code ke runner
        uses: actions/checkout@v4

      - name: Add kubectl to PATH
        run: echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Set Image Tag (date)
        run: echo "IMAGE_TAG=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Set Repository Name (Lowercase)
        run: echo "REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            ENV_FILE=.env
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/fe-fbsv2:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPO_OWNER }}/fe-fbsv2:latest

      # - name: Deploy ke Cluster Kubernetes
      #   env:
      #     KUBECONFIG: /home/itdev/.kube/config
      #   run: |
      #     kubectl apply -f react-deployment.yaml
      #     kubectl apply -f react-service-lb.yaml
      #     kubectl set image deployment/fe-fbsv2-deployment fe-fbsv2=ghcr.io/${{ env.REPO_OWNER }}/fe-fbsv2:${{ env.IMAGE_TAG }}
      #     kubectl rollout status deployment/fe-fbsv2-deployment
      - name: Deploy ke Cluster Kubernetes
        env:
          KUBECONFIG: /home/itdev/.kube/config
        run: |
          hostname; whoami; echo "PATH=$PATH"
          KUBECTL=/usr/local/bin/kubectl
          $KUBECTL apply -f react-deployment.yaml
          $KUBECTL apply -f react-service-lb.yaml
          $KUBECTL set image deployment/fe-fbsv2-deployment fe-fbsv2=ghcr.io/${{ env.REPO_OWNER }}/fe-fbsv2:${{ env.IMAGE_TAG }}
          $KUBECTL rollout status deployment/fe-fbsv2-deployment --timeout=5m

      - name: Hapus image lama di Runner
        run: docker image prune -f
