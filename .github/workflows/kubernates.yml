name: Deploy Production FBSV2 to Kubernetes
##
on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: [self-hosted, Linux]

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout Code ke runner
        uses: actions/checkout@v4

      - name: Set Image Tag (date)
        run: echo "IMAGE_TAG=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Set Repository Name (Lowercase)
        run: echo "REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 1. Login ke GHCR (GitHub Container Registry)
      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Setup Buildx untuk performa build Docker yang lebih optimal
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 2. Build & Push Image ke Registry
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            ENV_FILE=.env.staging
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/fe-fbsv2:${{ env.IMAGE_TAG }}
            ghcr.io/${{ env.REPO_OWNER }}/fe-fbsv2:latest

      # 3. Deploy ke Cluster Kubernetes
      - name: Deploy ke Cluster Kubernetes
        run: |
          kubectl apply -f react-deployment.yaml
          kubectl apply -f react-service-lb.yaml
          
          # Update image tag menggunakan image dari GHCR
          kubectl set image deployment/fe-fbsv2-deployment fe-fbsv2=ghcr.io/${{ env.REPO_OWNER }}/fe-fbsv2:${{ env.IMAGE_TAG }}
          kubectl rollout status deployment/fe-fbsv2-deployment

      # 4. Cleanup Image lokal di Runner (agar disk server runner tidak penuh)
      - name: Hapus image lama di Runner
        run: |
          docker image prune -f
